[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stupid-dependencies"
version = "2.0.0"
authors = [
    {name = "SDS Team", email = "sds@example.com"},
]
description = "Version-Agnostic Dependency Solver - Universal project doctor for ANY language, ANY version"
readme = "README_VERSION_AGNOSTIC.md"
requires-python = ">=3.8"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Software Distribution",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
keywords = [
    "dependencies",
    "version-management",
    "toolchain",
    "compatibility",
    "universal",
    "python",
    "elixir",
    "nodejs",
    "rust",
    "go",
    "java",
    "kotlin",
    "zig",
    "gleam",
    "gradle",
    "maven",
    "npm",
    "cargo",
    "mix",
    "version-agnostic"
]
dependencies = [
    "toml>=0.10.2",
    "packaging>=21.0",
    "requests>=2.25.0",
    "PyYAML>=6.0",
    "semver>=2.13.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10.0",
    "black>=23.0",
    "flake8>=6.0",
    "isort>=5.12.0",
    "mypy>=1.0",
    "types-toml>=0.10.8",
    "types-PyYAML>=6.0",
    "types-requests>=2.25.0",
    "pre-commit>=3.0.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
]
full = [
    "rich>=12.0.0",
    "tabulate>=0.9.0",
    "colorama>=0.4.4",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
]
build = [
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.scripts]
# Primary version-agnostic CLI
sds = "sds.cli_v2:main"
sds-v2 = "sds.cli_v2:main"

# Legacy CLI for compatibility
stupid-dependencies = "sds.cli:main"
stupid = "sds.cli:main"
sds-legacy = "sds.cli:main"

# Convenience aliases
dependency-doctor = "sds.cli_v2:main"
project-doctor = "sds.cli_v2:main"

[project.urls]
Homepage = "https://github.com/example/stupid-dependencies"
Repository = "https://github.com/example/stupid-dependencies"
Documentation = "https://stupid-dependencies.readthedocs.io/"
"Bug Reports" = "https://github.com/example/stupid-dependencies/issues"
Changelog = "https://github.com/example/stupid-dependencies/blob/main/CHANGELOG.md"
Demo = "https://github.com/example/stupid-dependencies/blob/main/demo_version_agnostic.py"

[tool.setuptools.packages.find]
where = ["."]
include = ["sds*"]

[tool.setuptools.package-data]
sds = [
    "config/*.yaml",
    "config/*.yml",
    "templates/*",
    "templates/**/*"
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Relaxed for compatibility
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "sds.core.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=sds",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "version_agnostic: marks tests for version-agnostic features",
]

[tool.coverage.run]
source = ["sds"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
    "demo*.py",
    "**/venv*/**",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "venv_sds"]
skips = ["B101"]  # Skip assert_used test

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    "venv*",
    ".mypy_cache",
    ".pytest_cache",
]

[tool.ruff]
line-length = 88
target-version = "py38"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N806", "N803"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    "venv*",
    ".mypy_cache",
    ".pytest_cache",
]

[tool.ruff.isort]
known-first-party = ["sds"]
