# Pre-commit configuration for SDS (Stupid Dependency Solver)
# Ensures code quality and consistency before commits

repos:
  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=88]

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=88]

  # Python linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=88, --extend-ignore=E203, W503]

  # Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-toml>=0.10.8]
        args: [--ignore-missing-imports]

  # Security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-r, sds/, -x, tests/]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # File format checks
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-xml

      # Python-specific checks
      - id: check-ast
      - id: check-docstring-first
      - id: debug-statements

      # General code quality
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: mixed-line-ending
        args: [--fix=lf]

      # Security checks
      - id: detect-private-key

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [--fix]

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        files: \.(sh|bash|zsh)$

  # Custom local hooks for SDS-specific checks
  - repo: local
    hooks:
      # Ensure version consistency
      - id: version-consistency
        name: Check version consistency
        entry: bash -c 'echo "Version consistency check - implement in CI"'
        language: system
        files: ^(setup\.py|pyproject\.toml|sds/__init__\.py)$
        pass_filenames: false

      # Check that examples are valid
      - id: validate-examples
        name: Validate example projects
        entry: bash -c 'echo "Example validation - implement in CI"'
        language: system
        files: ^examples/
        pass_filenames: false

      # SDS-specific linting
      - id: sds-personality-check
        name: Check personality messages
        entry: bash -c 'echo "Personality check - SDS has character!"'
        language: system
        files: ^sds/core/solver\.py$
        pass_filenames: false

# Configuration for specific hooks
default_language_version:
  python: python3.8

# Files to exclude from all hooks
exclude: |
  (?x)^(
    .*\.egg-info/.*|
    build/.*|
    dist/.*|
    \.git/.*|
    \.mypy_cache/.*|
    \.pytest_cache/.*|
    __pycache__/.*|
    \.venv/.*|
    venv/.*|
    htmlcov/.*
  )$

# Minimum pre-commit version required
minimum_pre_commit_version: 3.0.0

# CI-specific configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: []
  submodules: false
